[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animatica"
version = "0.1.0"
description = "Prompt-to-explainer-video CLI built on Manim"
requires-python = ">=3.10"
dependencies = [
  "manim==0.22.1",
  "pydantic>=2.5",
  "typer>=0.12",
  "httpx>=0.27",
  "platformdirs>=4",
  "imageio-ffmpeg>=0.4",
  "tomli>=2; python_version < '3.11'",
  # Direct imports in animatica.frame_lint (transitive via manim, declared
  # explicitly for clarity):
  "av>=10.0.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
animatica = "animatica.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
animatica = ["ai/providers.toml", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: needs Manim and LaTeX; skipped when they are missing"]

