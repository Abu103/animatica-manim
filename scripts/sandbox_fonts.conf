<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Shipped inside the sandbox runtime as native/etc/fonts.conf (see scripts/build_runtime.sh).
     A bare machine has no fontconfig setup and no fonts, so pango would render no text at all.
     This points fontconfig at the DejaVu fonts bundled in native/fonts (relative to this file)
     and nothing else: no system includes, so every sandbox renders text the same way. -->
<fontconfig>
  <dir prefix="relative">../fonts</dir>
  <cachedir prefix="xdg">animatica-fontconfig</cachedir>
</fontconfig>
