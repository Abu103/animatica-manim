name: native-deps

# Builds the native pieces manim needs (cairo + pango shared libs, and the two
# Python extensions that have no Linux wheels: pycairo, manimpango) inside a
# Debian bookworm container, so the result matches a Debian 12 host: glibc 2.36,
# CPython 3.11, x86_64.
#
# Why this exists: a sandbox/CI box without apt access cannot install
# libcairo2/libpango-1.0-0, and pip cannot even build pycairo without cairo
# headers. The runner has full internet, so it can.
#
# Modes (workflow_dispatch input):
#   smoke  - tiny artifact round-trip; proves the download path works
#   full   - build the bundle and upload it as an artifact
#   commit - build the bundle and also commit it to this branch, for hosts that
#            can only reach codeload.github.com
# workflow_dispatch only registers once this file is on the default branch, so
# the practical trigger is a push that touches this file (works on any branch).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke | full"
        required: true
        default: "full"
        type: choice
        options: [smoke, full]
  push:
    paths:
      - ".github/workflows/native-deps.yml"

env:
  # The bundle is committed to a dedicated `artifacts` branch (never to a code
  # branch): hosts that can only reach codeload.github.com fetch it from there.
  ARTIFACT_BRANCH: artifacts
  # "1" publishes the bundle as the `native-deps-v1` release asset, which is what
  # scripts/bootstrap.sh downloads when a machine has no cairo/pango packages.
  PUBLISH_RELEASE: "1"
  RELEASE_TAG: "native-deps-v1"

permissions:
  contents: write # mode=commit and the release asset
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Smoke artifact
        if: inputs.mode == 'smoke'
        run: |
          mkdir -p bundle
          echo "smoke $(date -u +%FT%TZ) on ${{ github.ref_name }}" > bundle/smoke.txt
          cat bundle/smoke.txt

      - name: Build cairo + pango wheels and shared libraries (bookworm = glibc 2.36)
        if: inputs.mode != 'smoke'
        run: |
          mkdir -p bundle
          docker run --rm -v "$PWD/bundle:/out" python:3.11-slim-bookworm bash -lc '
            set -euo pipefail
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              build-essential pkg-config libcairo2-dev libpango1.0-dev \
              libcairo2 libpixman-1-0 libpng16-16 libxrender1 libxext6 liblzo2-2 \
              libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
              libharfbuzz0b libfribidi0 libthai0 libdatrie1 libgraphite2-3 \
              libxcb-render0 libxcb-shm0
            python -V
            pip wheel --no-cache-dir --wheel-dir /out/wheels "pycairo>=1.14,<2" "manimpango>=0.6.1,<1"
            mkdir -p /out/lib
            cp -aL /usr/lib/x86_64-linux-gnu/lib{cairo,pixman-1,png16,Xrender,Xext,Xau,Xdmcp,lzo2,pango-1.0,pangoft2-1.0,pangocairo-1.0,harfbuzz,fribidi,thai,datrie,graphite2,xcb-render,xcb-shm}.so* /out/lib/ 2>/dev/null || true
            # fail loudly rather than shipping an incomplete bundle
            test -e /out/lib/libcairo.so.2
            test -e /out/lib/libpango-1.0.so.0
            ls /out/lib | head -50
            ls /out/wheels
          '

      - name: Pack bundle
        if: inputs.mode != 'smoke'
        run: |
          tar czf animatica-native.tar.gz -C bundle wheels lib
          ls -lh animatica-native.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: animatica-native
          path: |
            bundle/smoke.txt
            animatica-native.tar.gz
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit to the artifacts branch (codeload-only hosts)
        if: inputs.mode != 'smoke'
        run: |
          git config user.name "animatica-native-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Merge into the existing branch so the TeX bundle published by
          # tex-deps.yml survives; create it only if it does not exist yet.
          if git fetch origin "$ARTIFACT_BRANCH" 2>/dev/null; then
            git checkout -B "$ARTIFACT_BRANCH" "origin/$ARTIFACT_BRANCH"
          else
            git checkout --orphan "$ARTIFACT_BRANCH"
            git rm -r --cached . > /dev/null
          fi
          mkdir -p native
          cp animatica-native.tar.gz native/
          printf 'Prebuilt Linux bundles. Generated by GitHub Actions, never edited by hand:\n\n- native/animatica-native.tar.gz - pycairo/manimpango wheels + cairo/pango shared libraries\n- native/animatica-tex.tar.xz - latex + dvisvgm + the packages Manim uses\n' > native/README.md
          git add native/animatica-native.tar.gz native/README.md
          git commit -m "chore(native): cairo+pango bundle $(date -u +%Y-%m-%d)" || echo "no change"
          # both bundle workflows may publish at once: rebase and retry
          for attempt in 1 2 3; do
            if git push origin "$ARTIFACT_BRANCH"; then exit 0; fi
            echo "push rejected; rebasing (attempt $attempt)"
            git pull --rebase origin "$ARTIFACT_BRANCH" || git pull --no-rebase origin "$ARTIFACT_BRANCH" || true
          done
          exit 1

      - name: Publish the bundle as a release asset (one-line installer)
        if: inputs.mode != 'smoke' && env.PUBLISH_RELEASE == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # reusable URL: .../releases/download/<tag>/animatica-native.tar.gz
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "Native deps v1 (cairo + pango for Linux)" \
                 --notes "Prebuilt pycairo/manimpango wheels plus the cairo/pango shared libraries for Linux x86_64 (glibc >= 2.36). Downloaded automatically by scripts/bootstrap.sh when a machine has no cairo/pango packages. Rebuilt by .github/workflows/native-deps.yml."
          gh release upload "$RELEASE_TAG" animatica-native.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'
