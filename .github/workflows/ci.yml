name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libs for manim (cairo/pango)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config libpango1.0-dev libavcodec-dev libavformat-dev libswscale-dev
      - name: Install deps (no system TeX needed for unit tests)
        run: pip install -e . pytest imageio-ffmpeg
      - name: Run tests (render tests skip without manim/latex/ffmpeg)
        run: python -m pytest -q
      - name: Doctor smoke (informational)
        run: python -m animatica.cli doctor || true
