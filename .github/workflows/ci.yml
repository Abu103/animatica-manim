name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  linux:
    # Pinned: GitHub is moving ubuntu-latest from 24.04 to 26.04 between 2026-10-19 and
    # 2026-11-19, job by job, so the same workflow landed on both images and failed at random.
    # 24.04 is the image this job was green on. Try 26.04 via the manual "linux-26" job below.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # --no-install-recommends: the default pulls ~220 packages / 1.3 GB (a JDK, docs, GUI libs) and
      # took ~6.5 min. No system ffmpeg either: the imageio-ffmpeg wheel is the binary users get anyway.
      - name: System libs (cairo/pango)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libcairo2-dev pkg-config libpango1.0-dev
      # The TeX the project ships (45 MB, no compilation) instead of texlive-latex-extra
      # and friends, which took 10m47s on the runner. The bundle is verified by
      # compiling a real document: when it does not work, the apt route below
      # still does, so this job is never weaker than before, only faster.
      - name: Cache the TinyTeX tree
        uses: actions/cache@v4
        with:
          path: .tex
          key: tinytex-native-deps-v1-linux
      - name: LaTeX (TinyTeX bundle)
        run: |
          set -uo pipefail
          TEX="$GITHUB_WORKSPACE/.tex"
          BIN="$TEX/bin/x86_64-linux"
          mkdir -p "$TEX"
          if [ ! -x "$BIN/latex" ]; then
            curl -fsSL --max-time 600 \
              "https://github.com/Abu103/animatica-manim/releases/download/native-deps-v1/animatica-tex.tar.xz" \
              -o /tmp/animatica-tex.tar.xz || true
            [ -s /tmp/animatica-tex.tar.xz ] && tar xf /tmp/animatica-tex.tar.xz -C "$TEX" || true
          fi
          if [ -x "$BIN/latex" ]; then
            export PATH="$BIN:$PATH"
            # The bundle was built without varwidth, which standalone requires.
            kpsewhich varwidth.sty >/dev/null 2>&1 || "$BIN/tlmgr" install varwidth || true
            cd "$RUNNER_TEMP"
            printf '%s\n' '\documentclass[preview]{standalone}' '\usepackage[english]{babel}' \
              '\usepackage{amsmath}' '\begin{document}$x^2$\end{document}' > texprobe.tex
            if latex -interaction=nonstopmode texprobe.tex >/dev/null 2>&1; then
              echo "$BIN" >> "$GITHUB_ENV"
              echo "LaTeX: TinyTeX bundle ready"
              exit 0
            fi
          fi
          echo "::warning::the TinyTeX bundle did not compile; falling back to apt"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm fonts-lmodern
      - name: Python deps (including the TUI and test extras)
        run: pip install -e ".[dev,tui]"
      - name: Doctor (must pass)
        run: python -m animatica doctor
      # Every test must run here: no skips, no warnings, no failures. The gate
      # (scripts/ci_tests.py) fails the job if the suite is only partially exercised.
      - name: Full test suite (zero skips allowed)
        run: python scripts/ci_tests.py
      - name: Real render smoke test
        run: python scripts/ci_smoke.py
      # Renders the fixture and conformance storyboards for real and fails on any lint,
      # fallback, timing or duration warning. The suite does not render the corpus
      # any more, so this is the one place where it is rendered.
      - name: Fixture render gate (no lint/fallback/timing warnings)
        run: python scripts/ci_render_gate.py
      - name: Installers are valid bash
        run: |
          bash -n scripts/bootstrap.sh
          bash scripts/bootstrap.sh --help

  # Manual trial of the next image (Actions tab -> ci -> Run workflow). Never blocks a PR.
  # When this is green, change the linux job above to ubuntu-26.04 (or back to ubuntu-latest).
  linux-26:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libs (cairo/pango)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libcairo2-dev pkg-config libpango1.0-dev
      - name: LaTeX (TinyTeX bundle)
        run: |
          set -uo pipefail
          TEX="$GITHUB_WORKSPACE/.tex"
          BIN="$TEX/bin/x86_64-linux"
          mkdir -p "$TEX"
          if [ ! -x "$BIN/latex" ]; then
            curl -fsSL --max-time 600 \
              "https://github.com/Abu103/animatica-manim/releases/download/native-deps-v1/animatica-tex.tar.xz" \
              -o /tmp/animatica-tex.tar.xz || true
            [ -s /tmp/animatica-tex.tar.xz ] && tar xf /tmp/animatica-tex.tar.xz -C "$TEX" || true
          fi
          if [ -x "$BIN/latex" ]; then
            export PATH="$BIN:$PATH"
            kpsewhich varwidth.sty >/dev/null 2>&1 || "$BIN/tlmgr" install varwidth || true
            cd "$RUNNER_TEMP"
            printf '%s\n' '\documentclass[preview]{standalone}' '\usepackage[english]{babel}' \
              '\usepackage{amsmath}' '\begin{document}$x^2$\end{document}' > texprobe.tex
            if latex -interaction=nonstopmode texprobe.tex >/dev/null 2>&1; then
              echo "$BIN" >> "$GITHUB_ENV"
              echo "LaTeX: TinyTeX bundle ready"
              exit 0
            fi
          fi
          echo "::warning::the TinyTeX bundle did not compile; falling back to apt"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm fonts-lmodern
      - run: pip install -e ".[dev,tui]"
      - run: python -m animatica doctor
      - run: python scripts/ci_tests.py
      - run: python scripts/ci_smoke.py
      - run: python scripts/ci_render_gate.py


  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The real thing users run. It must set up Python, manim, ffmpeg and TeX by
      # itself, then skip prompts safely in CI and report the next interactive command.
      - name: Windows installer, end to end (PowerShell)
        run: pwsh -NoProfile -File scripts/bootstrap.ps1
      - name: Doctor from a non-project directory (bundle visibility)
        shell: pwsh
        run: |
          $d = Join-Path $env:TEMP "animatica-doctor-cwd-test"
          New-Item -ItemType Directory -Force $d | Out-Null
          $animatica = "$env:GITHUB_WORKSPACE\.venv\Scripts\animatica.exe"
          if (-not (Test-Path $animatica)) { Write-Host "::error::animatica.exe not found at $animatica"; exit 1 }
          $latex = Get-Command latex -ErrorAction SilentlyContinue
          if ($latex) { Write-Host "::error::latex is on PATH ($($latex.Source)); the bundle must not be discoverable"; exit 1 }
          Push-Location $d
          try { $output = & $animatica doctor 2>&1 } finally { Pop-Location }
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::doctor exited non-zero"; exit $LASTEXITCODE }
          if (-not (($output | Out-String) -match '\[OK \] latex:')) { Write-Host "::error::latex not OK in doctor output"; exit 1 }
      - name: TUI dependency installed by bootstrap
        run: .\\.venv\\Scripts\\python.exe -c "import textual; print('Textual import OK')"
      - name: Test extras into the venv the installer built
        run: |
          .\.venv\Scripts\python.exe -m ensurepip --upgrade 2>$null
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -q -e ".[dev,tui]"
      - name: Doctor (must pass)
        run: |
          $ErrorActionPreference = "Continue"
          $doctorOutput = & .\.venv\Scripts\python.exe -m animatica doctor 2>&1
          $doctorExit = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          $doctorOutput | ForEach-Object { Write-Host $_ }
          if ($doctorExit -ne 0) {
            $doctorOutput |
              Where-Object { "$_" -match "^\[FAIL\]" } |
              ForEach-Object { Write-Host "::error::$($_)" }
            exit $doctorExit
          }
      - name: Full test suite (zero skips allowed)
        run: .\.venv\Scripts\python.exe scripts/ci_tests.py
      - name: Real render smoke test (space + non-ASCII output paths)
        run: .\.venv\Scripts\python.exe scripts/ci_smoke.py
      # The suite does not render the conformance corpus any more, so this is
      # where it is rendered: the gate checks the lint, the fallbacks, the
      # timing and the promised durations of every storyboard.
      - name: Fixture render gate (no lint/fallback/timing warnings)
        run: .\.venv\Scripts\python.exe scripts/ci_render_gate.py
      - name: PowerShell installer parses
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\bootstrap.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "bootstrap.ps1 parses cleanly"
      - name: TeX diagnostics (only on failure)
        if: failure()
        run: |
          $ErrorActionPreference = "Continue"
          $env:PATH = "$env:APPDATA\TinyTeX\bin\windows;$env:PATH"
          $latex = Get-Command latex -ErrorAction SilentlyContinue
          $kpse = Get-Command kpsewhich -ErrorAction SilentlyContinue
          if ($latex) { Write-Host "latex: $($latex.Source)" } else { Write-Host "latex: unavailable" }
          if ($kpse) {
            foreach ($f in "standalone.cls","preview.sty","xkeyval.sty","english.ldf","amsmath.sty","amssymb.sty") {
              $found = & $kpse.Source $f 2>$null
              Write-Host ("kpsewhich {0} -> {1}" -f $f, ($found -join " "))
            }
          } else {
            Write-Host "kpsewhich: unavailable; package-file diagnostics skipped"
          }
          $d = Join-Path $env:RUNNER_TEMP "texdiag"
          New-Item -ItemType Directory -Force $d | Out-Null
          Set-Content (Join-Path $d "t.tex") '\documentclass[preview]{standalone}\usepackage[english]{babel}\usepackage{amsmath}\usepackage{amssymb}\begin{document}$x^2$\end{document}'
          if ($latex) {
            Push-Location $d
            try {
              $latexOutput = & $latex.Source -interaction=nonstopmode t.tex 2>&1
              $latexExit = $LASTEXITCODE
              $latexOutput | Select-Object -Last 15 | ForEach-Object { Write-Host $_ }
              Write-Host "latex exit code: $latexExit"
              Write-Host "---- t.log (first error + context)"
              if (Test-Path t.log) {
                Select-String -Path t.log -Pattern '^!' -Context 0,8 | Select-Object -First 1 | ForEach-Object { $_.Line; $_.Context.PostContext }
              } else {
                Write-Host "t.log was not created"
              }
            } finally {
              Pop-Location
            }
          } else {
            Write-Host "LaTeX compile probe skipped because latex is unavailable."
          }
          Write-Host "TeX diagnostics complete; the original job failure remains authoritative."
          exit 0

  # The HyperFrames backend has never been validated against a real browser:
  # this job gives it Node, Chrome and ffmpeg, renders a storyboard through the
  # pinned CLI, and checks the decoded frames instead of the exit code.
  hyperframes:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libs (cairo/pango for the manim import path, ffmpeg for the CLI)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libcairo2-dev pkg-config libpango1.0-dev ffmpeg
      - run: pip install -e ".[dev]"
      - name: The pinned HyperFrames CLI
        run: |
          npm install -g hyperframes@0.9.19
          hyperframes --version || true
          node --version
      - name: Browser the CLI can drive
        run: |
          google-chrome --version || chromium --version || chromium-browser --version || echo "no system browser"
      - name: Real render (Node + Chrome)
        run: python scripts/ci_hyperframes.py
      - name: Diagnostics (only on failure)
        if: failure()
        run: |
          node --version; npm --version
          hyperframes --version || true
          google-chrome --version || true
          ls -la /usr/bin | grep -i chrom | head -5 || true
