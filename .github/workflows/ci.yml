name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  linux-tests:
    # Pinned: GitHub is moving ubuntu-latest from 24.04 to 26.04 between 2026-10-19 and
    # 2026-11-19, job by job, so the same workflow landed on both images and failed at random.
    # 24.04 is the image this job was green on. Try 26.04 via the manual "linux-26" job below.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # --no-install-recommends: the default pulls ~220 packages / 1.3 GB (a JDK, docs, GUI libs) and
      # took ~6.5 min. No system ffmpeg either: the imageio-ffmpeg wheel is the binary users get anyway.
      - name: A cache key that rotates every week
        run: echo "APT_WEEK=$(date -u +%G%V)" >> "$GITHUB_ENV"
      - name: Cache the apt downloads
        uses: actions/cache@v4
        with:
          path: .apt-cache
          key: apt-archives-v2-${{ runner.os }}-noble-cairo-${{ env.APT_WEEK }}
      - name: System libs (cairo/pango)
        run: |
          # Pick the first Ubuntu mirror that answers within 5 s (https first).
          PICK=""
          for m in https://archive.ubuntu.com/ubuntu \
                   https://mirrors.edge.kernel.org/ubuntu \
                   https://mirror.math.princeton.edu/pub/ubuntu \
                   https://mirrors.xtom.com/ubuntu \
                   http://azure.archive.ubuntu.com/ubuntu; do
            if curl -fsI --max-time 5 "$m/dists/noble/InRelease" >/dev/null 2>&1; then PICK="$m"; break; fi
          done
          echo "apt mirror: ${PICK:-none reachable}"
          if [ -n "$PICK" ]; then
            printf '%s\n' "$PICK" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i -E "s#https?://[^ ]*(archive|security)\.ubuntu\.com/ubuntu#$PICK#g" \
              /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          fi
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT update
          mkdir -p .apt-cache
          if compgen -G ".apt-cache/*.deb" > /dev/null; then
            sudo cp -n .apt-cache/*.deb /var/cache/apt/archives/
          fi
          sudo apt-get $APT -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends libcairo2-dev pkg-config libpango1.0-dev
          sudo cp -n /var/cache/apt/archives/*.deb .apt-cache/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" .apt-cache    # The TeX the project ships (45 MB, no compilation) instead of texlive-latex-extra
      # and friends, which took 10m47s on the runner. The bundle is verified by
      # compiling a real document: when it does not work, the apt route below
      # still does, so this job is never weaker than before, only faster.
      - name: Cache the TinyTeX tree
        uses: actions/cache@v4
        with:
          path: .tex
          key: tinytex-native-deps-v1-linux
      - name: LaTeX (TinyTeX bundle)
        run: |
          set -uo pipefail
          TEX="$GITHUB_WORKSPACE/.tex"
          BIN="$TEX/bin/x86_64-linux"
          mkdir -p "$TEX"
          if [ ! -x "$BIN/latex" ]; then
            curl -fsSL --max-time 600 \
              "https://github.com/Abu103/animatica-manim/releases/download/native-deps-v1/animatica-tex.tar.xz" \
              -o /tmp/animatica-tex.tar.xz || true
            [ -s /tmp/animatica-tex.tar.xz ] && tar xf /tmp/animatica-tex.tar.xz -C "$TEX" || true
          fi
          if [ -x "$BIN/latex" ]; then
            export PATH="$BIN:$PATH"
            # The bundle was built without varwidth, which standalone requires.
            kpsewhich varwidth.sty >/dev/null 2>&1 || "$BIN/tlmgr" install varwidth || true
            cd "$RUNNER_TEMP"
            printf '%s\n' '\documentclass[preview]{standalone}' '\usepackage[english]{babel}' \
              '\usepackage{amsmath}' '\begin{document}$x^2$\end{document}' > texprobe.tex
            if latex -interaction=nonstopmode texprobe.tex >/dev/null 2>&1; then
              # $GITHUB_ENV takes NAME=VALUE pairs, not a bare path.
              echo "PATH=$BIN:$PATH" >> "$GITHUB_ENV"
              echo "LaTeX: TinyTeX bundle ready"
              exit 0
            fi
          fi
          echo "::warning::the TinyTeX bundle did not compile; falling back to apt"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm fonts-lmodern
      - name: Python deps (including the TUI and test extras)
        run: pip install -e ".[dev,tui]"
      - name: Doctor (must pass)
        run: python -m animatica doctor
      # Every test must run here: no skips, no warnings, no failures. The gate
      # (scripts/ci_tests.py) fails the job if the suite is only partially exercised.
      - name: Full test suite (zero skips allowed)
        run: python scripts/ci_tests.py

  linux-render:
    # Pinned: same image as linux-tests so both jobs can be compared.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: A cache key that rotates every week
        run: echo "APT_WEEK=$(date -u +%G%V)" >> "$GITHUB_ENV"
      - name: Cache the apt downloads
        uses: actions/cache@v4
        with:
          path: .apt-cache
          key: apt-archives-v2-${{ runner.os }}-noble-cairo-${{ env.APT_WEEK }}
      - name: System libs (cairo/pango)
        run: |
          # Pick the first Ubuntu mirror that answers within 5 s (https first).
          PICK=""
          for m in https://archive.ubuntu.com/ubuntu \
                   https://mirrors.edge.kernel.org/ubuntu \
                   https://mirror.math.princeton.edu/pub/ubuntu \
                   https://mirrors.xtom.com/ubuntu \
                   http://azure.archive.ubuntu.com/ubuntu; do
            if curl -fsI --max-time 5 "$m/dists/noble/InRelease" >/dev/null 2>&1; then PICK="$m"; break; fi
          done
          echo "apt mirror: ${PICK:-none reachable}"
          if [ -n "$PICK" ]; then
            printf '%s\n' "$PICK" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i -E "s#https?://[^ ]*(archive|security)\.ubuntu\.com/ubuntu#$PICK#g" \
              /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          fi
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT update
          mkdir -p .apt-cache
          if compgen -G ".apt-cache/*.deb" > /dev/null; then
            sudo cp -n .apt-cache/*.deb /var/cache/apt/archives/
          fi
          sudo apt-get $APT -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends libcairo2-dev pkg-config libpango1.0-dev
          sudo cp -n /var/cache/apt/archives/*.deb .apt-cache/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" .apt-cache
      - name: Cache the TinyTeX tree
        uses: actions/cache@v4
        with:
          path: .tex
          key: tinytex-native-deps-v1-linux
      - name: LaTeX (TinyTeX bundle)
        run: |
          set -uo pipefail
          TEX="$GITHUB_WORKSPACE/.tex"
          BIN="$TEX/bin/x86_64-linux"
          mkdir -p "$TEX"
          if [ ! -x "$BIN/latex" ]; then
            curl -fsSL --max-time 600 \
              "https://github.com/Abu103/animatica-manim/releases/download/native-deps-v1/animatica-tex.tar.xz" \
              -o /tmp/animatica-tex.tar.xz || true
            [ -s /tmp/animatica-tex.tar.xz ] && tar xf /tmp/animatica-tex.tar.xz -C "$TEX" || true
          fi
          if [ -x "$BIN/latex" ]; then
            export PATH="$BIN:$PATH"
            kpsewhich varwidth.sty >/dev/null 2>&1 || "$BIN/tlmgr" install varwidth || true
            cd "$RUNNER_TEMP"
            printf '%s\n' '\documentclass[preview]{standalone}' '\usepackage[english]{babel}' \
              '\usepackage{amsmath}' '\begin{document}$x^2$\end{document}' > texprobe.tex
            if latex -interaction=nonstopmode texprobe.tex >/dev/null 2>&1; then
              echo "PATH=$BIN:$PATH" >> "$GITHUB_ENV"
              echo "LaTeX: TinyTeX bundle ready"
              exit 0
            fi
          fi
          echo "::warning::the TinyTeX bundle did not compile; falling back to apt"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm fonts-lmodern
      - name: Python deps (including the TUI and test extras)
        run: pip install -e ".[dev,tui]"
      - name: Doctor (must pass)
        run: python -m animatica doctor
      # Persisted render cache: restored before the gate so a cold gate reuses
      # renders already on disk, saved after it only on main so a PR never
      # pollutes the cache its own fork would read.
      - name: Restore the render cache
        uses: actions/cache/restore@v4
        with:
          path: .animatica_cache/renders
          key: render-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: render-cache-${{ runner.os }}-
      - name: Real render smoke test
        run: python scripts/ci_smoke.py
      - name: Fixture render gate (no lint/fallback/timing warnings)
        run: python scripts/ci_render_gate.py
      - name: Installers are valid bash
        run: |
          bash -n scripts/bootstrap.sh
          bash scripts/bootstrap.sh --help
      - name: Save the render cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .animatica_cache/renders
          key: render-cache-${{ runner.os }}-${{ github.run_id }}

  # Aggregator: green only when both halves of the old linux job are green.
  # Never blocks a PR on its own; merge queues gate on it through branch protection.
  linux:
    if: always()
    runs-on: ubuntu-24.04
    needs: [linux-tests, linux-render]
    steps:
      - name: Both linux halves must be green
        run: |
          if [ "${{ needs.linux-tests.result }}" != "success" ] || [ "${{ needs.linux-render.result }}" != "success" ]; then
            echo "::error::linux is red: linux-tests=${{ needs.linux-tests.result }}, linux-render=${{ needs.linux-render.result }}"
            exit 1
          fi
          echo "linux: linux-tests and linux-render both succeeded"

  # Manual trial of the next image (Actions tab -> ci -> Run workflow). Never blocks a PR.
  # When this is green, change the linux job above to ubuntu-26.04 (or back to ubuntu-latest).
  linux-26:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libs (cairo/pango)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libcairo2-dev pkg-config libpango1.0-dev
      - name: LaTeX (TinyTeX bundle)
        run: |
          set -uo pipefail
          TEX="$GITHUB_WORKSPACE/.tex"
          BIN="$TEX/bin/x86_64-linux"
          mkdir -p "$TEX"
          if [ ! -x "$BIN/latex" ]; then
            curl -fsSL --max-time 600 \
              "https://github.com/Abu103/animatica-manim/releases/download/native-deps-v1/animatica-tex.tar.xz" \
              -o /tmp/animatica-tex.tar.xz || true
            [ -s /tmp/animatica-tex.tar.xz ] && tar xf /tmp/animatica-tex.tar.xz -C "$TEX" || true
          fi
          if [ -x "$BIN/latex" ]; then
            export PATH="$BIN:$PATH"
            kpsewhich varwidth.sty >/dev/null 2>&1 || "$BIN/tlmgr" install varwidth || true
            cd "$RUNNER_TEMP"
            printf '%s\n' '\documentclass[preview]{standalone}' '\usepackage[english]{babel}' \
              '\usepackage{amsmath}' '\begin{document}$x^2$\end{document}' > texprobe.tex
            if latex -interaction=nonstopmode texprobe.tex >/dev/null 2>&1; then
              # $GITHUB_ENV takes NAME=VALUE pairs, not a bare path.
              echo "PATH=$BIN:$PATH" >> "$GITHUB_ENV"
              echo "LaTeX: TinyTeX bundle ready"
              exit 0
            fi
          fi
          echo "::warning::the TinyTeX bundle did not compile; falling back to apt"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm fonts-lmodern
      - run: pip install -e ".[dev,tui]"
      - run: python -m animatica doctor
      - run: python scripts/ci_tests.py
      - run: python scripts/ci_smoke.py
      - run: python scripts/ci_render_gate.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Python + uv
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv (with dependency cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # --------------------------------------------------
      # TinyTeX cache
      # --------------------------------------------------

      - name: Restore TinyTeX cache
        uses: actions/cache/restore@v4
        with:
          path: .tex
          key: windows-tex-native-deps-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            windows-tex-native-deps-v1-${{ runner.os }}-

      # --------------------------------------------------
      # Real installer test
      # --------------------------------------------------

      - name: Windows installer, end to end (PowerShell)
        run: pwsh -NoProfile -File scripts/bootstrap.ps1

      - name: Save TinyTeX cache
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .tex
          key: windows-tex-native-deps-v1-${{ runner.os }}-${{ github.run_id }}

      # --------------------------------------------------
      # Installer verification
      # --------------------------------------------------

      - name: Doctor from a non-project directory (bundle visibility)
        shell: pwsh
        run: |
          $d = Join-Path $env:TEMP "animatica-doctor-cwd-test"
          New-Item -ItemType Directory -Force $d | Out-Null

          $animatica = "$env:GITHUB_WORKSPACE\.venv\Scripts\animatica.exe"

          if (-not (Test-Path $animatica)) {
            Write-Host "::error::animatica.exe not found at $animatica"
            exit 1
          }

          $latex = Get-Command latex -ErrorAction SilentlyContinue

          if ($latex) {
            Write-Host "::error::latex is on PATH ($($latex.Source)); the bundle must not be discoverable"
            exit 1
          }

          Push-Location $d
          try {
            $output = & $animatica doctor 2>&1
          } finally {
            Pop-Location
          }

          $output | ForEach-Object { Write-Host $_ }

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::doctor exited non-zero"
            exit $LASTEXITCODE
          }

          if (-not (($output | Out-String) -match '\[OK \] latex:')) {
            Write-Host "::error::latex not OK in doctor output"
            exit 1
          }

      - name: TUI dependency installed by bootstrap
        run: .\.venv\Scripts\python.exe -c "import textual; print('Textual import OK')"

      # --------------------------------------------------
      # Development and test dependencies
      # --------------------------------------------------

      - name: Install development and test extras
        run: |
          uv pip install --python .\.venv\Scripts\python.exe -e ".[dev,tui]"

      # --------------------------------------------------
      # Health checks
      # --------------------------------------------------

      - name: Doctor (must pass)
        run: |
          $ErrorActionPreference = "Continue"

          $doctorOutput = & .\.venv\Scripts\python.exe -m animatica doctor 2>&1
          $doctorExit = $LASTEXITCODE

          $ErrorActionPreference = "Stop"

          $doctorOutput | ForEach-Object { Write-Host $_ }

          if ($doctorExit -ne 0) {
            $doctorOutput |
              Where-Object { "$_" -match "^\[FAIL\]" } |
              ForEach-Object { Write-Host "::error::$($_)" }

            exit $doctorExit
          }

      # --------------------------------------------------
      # Complete test suite
      # --------------------------------------------------

      - name: Full test suite (zero skips allowed)
        run: .\.venv\Scripts\python.exe scripts/ci_tests.py

      # --------------------------------------------------
      # Real rendering
      # --------------------------------------------------

      - name: Real render smoke test (space + non-ASCII output paths)
        run: .\.venv\Scripts\python.exe scripts/ci_smoke.py

      # --------------------------------------------------
      # Persistent render cache
      # --------------------------------------------------

      - name: Restore the render cache
        uses: actions/cache/restore@v4
        with:
          path: .animatica_cache/renders
          key: render-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            render-cache-${{ runner.os }}-

      - name: Fixture render gate (no lint/fallback/timing warnings)
        run: .\.venv\Scripts\python.exe scripts/ci_render_gate.py

      - name: Save the render cache
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .animatica_cache/renders
          key: render-cache-${{ runner.os }}-${{ github.run_id }}

      # --------------------------------------------------
      # Installer syntax validation
      # --------------------------------------------------

      - name: PowerShell installer parses
        run: |
          $errs = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\scripts\bootstrap.ps1",
            [ref]$null,
            [ref]$errs
          ) | Out-Null

          if ($errs) {
            $errs | ForEach-Object { Write-Host $_ }
            exit 1
          }

          Write-Host "bootstrap.ps1 parses cleanly"

      # --------------------------------------------------
      # Failure diagnostics
      # --------------------------------------------------

      - name: TeX diagnostics (only on failure)
        if: failure()
        run: |
          $ErrorActionPreference = "Continue"

          $texBin = Join-Path $env:GITHUB_WORKSPACE ".tex\bin\windows"

          if (Test-Path $texBin) {
            $env:PATH = "$texBin;$env:PATH"
          }

          $latex = Get-Command latex -ErrorAction SilentlyContinue
          $kpse = Get-Command kpsewhich -ErrorAction SilentlyContinue

          if ($latex) {
            Write-Host "latex: $($latex.Source)"
          } else {
            Write-Host "latex: unavailable"
          }

          if ($kpse) {
            foreach ($f in "standalone.cls","preview.sty","xkeyval.sty","english.ldf","amsmath.sty","amssymb.sty") {
              $found = & $kpse.Source $f 2>$null
              Write-Host ("kpsewhich {0} -> {1}" -f $f, ($found -join " "))
            }
          } else {
            Write-Host "kpsewhich: unavailable; package-file diagnostics skipped"
          }

          $d = Join-Path $env:RUNNER_TEMP "texdiag"
          New-Item -ItemType Directory -Force $d | Out-Null

          Set-Content (Join-Path $d "t.tex") '\documentclass[preview]{standalone}\usepackage[english]{babel}\usepackage{amsmath}\usepackage{amssymb}\begin{document}$x^2$\end{document}'

          if ($latex) {
            Push-Location $d

            try {
              $latexOutput = & $latex.Source -interaction=nonstopmode t.tex 2>&1
              $latexExit = $LASTEXITCODE

              $latexOutput | Select-Object -Last 15 | ForEach-Object { Write-Host $_ }

              Write-Host "latex exit code: $latexExit"
              Write-Host "---- t.log (first error + context)"

              if (Test-Path t.log) {
                Select-String -Path t.log -Pattern '^!' -Context 0,8 |
                  Select-Object -First 1 |
                  ForEach-Object {
                    $_.Line
                    $_.Context.PostContext
                  }
              } else {
                Write-Host "t.log was not created"
              }
            } finally {
              Pop-Location
            }
          } else {
            Write-Host "LaTeX compile probe skipped because latex is unavailable."
          }

          Write-Host "TeX diagnostics complete; the original job failure remains authoritative."
          exit 0

  # The HyperFrames backend has never been validated against a real browser:
  # this job gives it Node, Chrome and ffmpeg, renders a storyboard through the
  # pinned CLI, and checks the decoded frames instead of the exit code.
  hyperframes:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The Ubuntu archive mirror is fast most of the time and throttled now
      # and then: the same 71 MB took 16 s in one run and more than four
      # minutes in the next, with apt ignoring and retrying three packages on
      # the way. Caching the downloads keeps the bad days short -- apt takes
      # the .deb files it finds in the cache and only fetches what is missing.
      - name: A cache key that rotates every week
        run: echo "APT_WEEK=$(date -u +%G%V)" >> "$GITHUB_ENV"
      - name: Cache the apt downloads
        uses: actions/cache@v4
        with:
          # A directory of .deb files the runner user owns. apt's own cache
          # belongs to root, and the cache action runs as the runner user:
          # it can neither read the lock and partial/ inside it nor write the
          # files back into it ("Permission denied").
          path: .apt-cache
          key: apt-archives-v2-${{ runner.os }}-noble-ffmpeg-${{ env.APT_WEEK }}

      - name: System libs (cairo/pango for the manim import path, ffmpeg for the CLI)
        run: |
          # Pick the first Ubuntu mirror that answers within 5 s (https first).
          PICK=""
          for m in https://archive.ubuntu.com/ubuntu \
                   https://mirrors.edge.kernel.org/ubuntu \
                   https://mirror.math.princeton.edu/pub/ubuntu \
                   https://mirrors.xtom.com/ubuntu \
                   http://azure.archive.ubuntu.com/ubuntu; do
            if curl -fsI --max-time 5 "$m/dists/noble/InRelease" >/dev/null 2>&1; then
              PICK="$m"
              break
            fi
          done

          echo "apt mirror: ${PICK:-none reachable}"

          if [ -n "$PICK" ]; then
            printf '%s\n' "$PICK" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i -E "s#https?://[^ ]*(archive|security)\.ubuntu\.com/ubuntu#$PICK#g" \
              /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          fi

          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"

          sudo apt-get $APT update

          # Restore previously downloaded packages.
          mkdir -p .apt-cache
          if compgen -G ".apt-cache/*.deb" > /dev/null; then
            sudo cp -n .apt-cache/*.deb /var/cache/apt/archives/
          fi

          # Install only required dependencies.
          sudo apt-get $APT -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends \
            libcairo2-dev pkg-config libpango1.0-dev ffmpeg

          # Persist downloaded packages for subsequent runs.
          sudo cp -n /var/cache/apt/archives/*.deb .apt-cache/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" .apt-cache

      - run: pip install -e ".[dev]"
      - name: The pinned HyperFrames CLI
        run: |
          npm install -g hyperframes@0.9.19
          hyperframes --version || true
          node --version
      - name: Browser the CLI can drive
        run: |
          google-chrome --version || chromium --version || chromium-browser --version || echo "no system browser"
      - name: Real render (Node + Chrome)
        run: python scripts/ci_hyperframes.py
      - name: Diagnostics (only on failure)
        if: failure()
        run: |
          node --version; npm --version
          hyperframes --version || true
          google-chrome --version || true
          ls -la /usr/bin | grep -i chrom | head -5 || true
