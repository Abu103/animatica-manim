name: sandbox-runtime

# Builds and publishes the prebuilt runtime that scripts/sandbox.sh fetches
# (docs/superpowers/specs/2026-11-12-sandbox-bootstrap-design.md).
#
# Published under the key from scripts/runtime_key.sh, in two places so every
# network tier can reach it:
#   - release  runtime-<key>  with animatica-runtime-<key>.tar.gz + SHA256SUMS
#   - branch   runtime-<key>  with part-NN + SHA256SUMS (codeload-only hosts)
# and a tiny branch `runtime-latest` whose KEY file names the newest key.
# The nightly run only does work when something published went missing.
on:
  push:
    paths:
      - "pyproject.toml"
      - ".github/workflows/sandbox-runtime.yml"
      - "scripts/build_runtime.sh"
      - "scripts/runtime_key.sh"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Compute the runtime key
        id: key
        run: echo "key=$(sh scripts/runtime_key.sh)" >> "$GITHUB_OUTPUT"

      - name: Already published?
        id: have
        run: |
          KEY="${{ steps.key.outputs.key }}"
          if gh release view "runtime-$KEY" >/dev/null 2>&1 \
             && git ls-remote --exit-code --heads origin "runtime-$KEY" >/dev/null 2>&1 \
             && git ls-remote --exit-code --heads origin runtime-latest >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "runtime-$KEY is already published; nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the runtime (Debian 12 = glibc 2.36)
        if: steps.have.outputs.published != 'true'
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" -w /src python:3.12-slim-bookworm bash -lc '
            set -euo pipefail
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              build-essential pkg-config curl ca-certificates libcairo2-dev libpango1.0-dev \
              libcairo2 libpixman-1-0 libpng16-16 libxrender1 libxext6 liblzo2-2 \
              libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
              libharfbuzz0b libfribidi0 libthai0 libdatrie1 libgraphite2-3 \
              libxcb-render0 libxcb-shm0
            sh scripts/build_runtime.sh /out
          '
          ls -lh out

      - name: Publish the release asset
        if: steps.have.outputs.published != 'true'
        run: |
          KEY="${{ steps.key.outputs.key }}"
          TAG="runtime-$KEY"
          FILES="out/animatica-runtime-$KEY.tar.gz out/SHA256SUMS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "Sandbox runtime $KEY" \
              --notes "Prebuilt runtime for scripts/sandbox.sh. Generated by sandbox-runtime.yml; never edited by hand." \
              --latest=false
          fi

      - name: Publish the codeload branches
        if: steps.have.outputs.published != 'true'
        run: |
          KEY="${{ steps.key.outputs.key }}"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORK="$(mktemp -d)"
          cd "$WORK"
          git init -q
          git config user.name "animatica-runtime-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "$URL"
          git checkout -q --orphan "runtime-$KEY"
          cp "$GITHUB_WORKSPACE"/out/part-* "$GITHUB_WORKSPACE/out/SHA256SUMS" .
          git add -A
          git commit -qm "sandbox runtime $KEY"
          git push -f origin "runtime-$KEY"
          git checkout -q --orphan runtime-latest-tmp
          git rm -rfq . >/dev/null
          echo "$KEY" > KEY
          git add KEY
          git commit -qm "latest sandbox runtime: $KEY"
          git push -f origin runtime-latest-tmp:runtime-latest

      - name: Prune old runtime branches (keep the last 3)
        if: steps.have.outputs.published != 'true'
        run: |
          git fetch -q --depth=1 origin '+refs/heads/runtime-*:refs/remotes/origin/runtime-*'
          git for-each-ref --sort=-committerdate --format='%(refname:strip=3)' 'refs/remotes/origin/runtime-*' \
            | grep -v '^runtime-latest$' | tail -n +4 \
            | while read -r b; do git push origin --delete "$b"; done
