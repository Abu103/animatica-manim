name: tex-deps

# A small, self-contained LaTeX for hosts that cannot install TeX Live:
# latex + dvisvgm + exactly the packages Manim uses, stripped of docs, sources
# and the engines nobody needs. Published as a release asset (the one-line
# installers fetch it) and committed to the `artifacts` branch so a host that
# can only reach codeload.github.com can still get it.
on:
  push:
    paths:
      - ".github/workflows/tex-deps.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  ARTIFACT_BRANCH: artifacts
  RELEASE_TAG: native-deps-v1

jobs:
  tex:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install TinyTeX
        run: curl -fsSL https://yihui.org/tinytex/install-unx.sh | sh

      - name: Install exactly what Manim's LaTeX path needs
        run: |
          TLMGR=$(find "$HOME" -name tlmgr -path "*/bin/*" | head -1)
          echo "tlmgr: $TLMGR"
          "$TLMGR" install standalone preview xkeyval babel-english amsmath amsfonts dvisvgm lm geometry xcolor
          echo "--- probe ---"
          TEXBIN=$(dirname "$TLMGR")
          echo "$TEXBIN" >> "$GITHUB_PATH"

      - name: Strip docs, sources and unused engines
        run: |
          set -euo pipefail
          TLMGR=$(find "$HOME" -name tlmgr -path "*/bin/*" | head -1)
          TEXBIN=$(dirname "$TLMGR")
          TEXROOT=$(dirname "$(dirname "$TEXBIN")")
          echo "TinyTeX root: $TEXROOT"
          du -sh "$TEXROOT" || true

          # documentation and package sources dominate a TinyTeX tree
          find "$TEXROOT/texmf-dist" -type d \( -name doc -o -name source -o -name sources \) -prune -exec rm -rf {} + 2>/dev/null || true
          # engines and helpers this project never calls
          for exe in luatex luahbtex texlua luajitcontext context mtxrun mf mf-nowin \
                     xetex xdvipdfmx gs gsx ps2pdf epstopdf repstopdf t1testpage \
                     luatexdir xetexdir pdftexdir; do
            find "$TEXBIN" -maxdepth 1 -name "$exe" -exec rm -f {} + 2>/dev/null || true
          done
          rm -rf "$TEXROOT"/bin/*/{luatex,xetex} 2>/dev/null || true
          # man pages, info files, tlpkg indexes
          rm -rf "$TEXROOT"/texmf-dist/doc "$TEXROOT"/texmf-dist/source 2>/dev/null || true
          rm -rf "$TEXROOT"/tlpkg/tlpobj 2>/dev/null || true

          du -sh "$TEXROOT" || true
          echo "TEXROOT=$TEXROOT" >> "$GITHUB_ENV"

      - name: Check the bundle still compiles an equation
        run: |
          set -euo pipefail
          TEXBIN=$(find "$HOME" -name tlmgr -path "*/bin/*" | head -1 | xargs dirname)
          export PATH="$TEXBIN:$PATH"
          # tlmgr sometimes drops dvisvgm outside bin/<arch>; find it wherever it is
          DVISVGM=$(find "$HOME" -name dvisvgm -type f | head -1)
          echo "dvisvgm: ${DVISVGM:-MISSING}"
          [ -n "$DVISVGM" ] && export PATH="$(dirname "$DVISVGM"):$PATH"
          echo "latex: $(command -v latex)"
          mkdir -p /tmp/probe && cd /tmp/probe
          cat > t.tex <<'TEX'
          \documentclass[preview]{standalone}
          \usepackage[english]{babel}
          \usepackage{amsmath}
          \usepackage{amssymb}
          \begin{document}
          $a^2 + b^2 = c^2$
          \end{document}
          TEX
          latex -interaction=nonstopmode t.tex > /dev/null
          dvisvgm --version
          dvisvgm --no-fonts t.dvi -o t.svg
          test -s t.svg && echo "probe compiled: $(wc -c < t.svg) bytes of SVG"

      - name: Pack the bundle
        run: |
          set -euo pipefail
          TEXROOT="${{ env.TEXROOT }}"
          TEXROOT=${TEXROOT:-$(dirname "$(dirname "$(find "$HOME" -name tlmgr -path "*/bin/*" | head -1 | xargs dirname)")")}
          mkdir -p bundle
          cp -a "$TEXROOT" bundle/tex
          # record the layout so the installer does not have to guess
          printf '%s\n' "$(cd bundle/tex && find . -maxdepth 2 -type d -name bin -exec ls {} \;)" > bundle/README.txt
          tar -C bundle -cf - tex | xz -9e -T0 > animatica-tex.tar.xz
          ls -lh animatica-tex.tar.xz
          MB=$(( $(stat -c %s animatica-tex.tar.xz) / 1024 / 1024 ))
          echo "size=$MB MB"
          echo "::notice title=tex bundle size::animatica-tex.tar.xz is $MB MB"

      - name: Commit to the artifacts branch (codeload-only hosts)
        run: |
          set -euo pipefail
          git config user.name "animatica-native-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$ARTIFACT_BRANCH"
          git rm -r --cached . > /dev/null
          mkdir -p native
          cp animatica-tex.tar.xz native/
          printf 'Prebuilt dependencies for hosts that cannot install them.\nGenerated by .github/workflows/tex-deps.yml and native-deps.yml.\n' > native/README.md
          git add -f native/animatica-tex.tar.xz native/README.md
          git commit -m "artifacts: LaTeX bundle (latex + dvisvgm for Manim)"
          git push --force origin "HEAD:$ARTIFACT_BRANCH"

      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "Native deps v1 (cairo + pango for Linux)" \
                 --notes "Prebuilt libraries for hosts without package managers. Downloaded automatically by scripts/bootstrap.sh."
          gh release upload "$RELEASE_TAG" animatica-tex.tar.xz --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'
